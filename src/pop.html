<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<script src="theme.js"></script>
<script src="i18n.js"></script>
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:var(--surface);color:var(--text);font:14px "Segoe UI",system-ui,sans-serif;user-select:none}
body{padding:6px;border:1px solid var(--line);border-radius:0 0 12px 12px}
.r{display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:8px}
.r.on{background:var(--soft)}
b{width:72px;color:var(--acc-text);font-weight:600}
.ic{flex:none;width:18px;height:18px;color:var(--dim)}
.r.on .ic{color:var(--text)}
span{flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
small{flex:none;max-width:45%;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;color:var(--dim);font-size:12px}
</style>
</head>
<body>
<div id="l" data-nt></div>
<script src="icons.js"></script>
<script>
const { listen, emitTo } = __TAURI__.event;
const l = document.getElementById('l');
const esc = s => String(s).replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
let shown = [];
listen('items', ({ payload: { items, sel } }) => {
  shown = items;
  l.innerHTML = items.map((it, i) => `<div class="r${i === sel ? ' on' : ''}" data-i="${i}">${icon(it.ic || it.tag.slice(1))}${it.tag ? `<b>${esc(it.tag)}</b>` : ''}<span>${esc(it.label)}</span><small>${esc(it.hint)}</small></div>`).join('');
});
l.addEventListener('mousedown', e => {
  const r = e.target.closest('.r');
  // Send the url itself: by the time an index arrived, the UI's list could already be a different one.
  const it = r && shown[+r.dataset.i];
  if (it) emitTo('ui', 'pick', it.url);
});
</script>
</body>
</html>
