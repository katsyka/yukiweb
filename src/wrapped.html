<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>YukiWeb Wrapped</title>
<script src="theme.js"></script>
<script src="i18n.js"></script>
<style>
*{box-sizing:border-box;margin:0}
body{background:var(--page);color:var(--text);font:15px "Segoe UI",system-ui,sans-serif}
main{width:min(880px,100%);margin:0 auto;padding:48px 20px 80px}
.per{display:flex;gap:6px;margin-bottom:56px}
.per button{height:34px;padding:0 16px;border:1px solid var(--line);border-radius:17px;background:var(--surface);color:var(--text);font:600 13px "Segoe UI",system-ui,sans-serif;cursor:pointer}
.per button.on{border-color:var(--acc);background:var(--acc);color:var(--on-acc)}
.k{color:var(--dim);font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
.hero h1{margin:10px 0 22px;font-size:clamp(56px,11vw,112px);font-weight:800;letter-spacing:-.05em;line-height:.95}
.hero h1 u{text-decoration:none;box-shadow:inset 0 -.18em var(--acc)}
.hero p{color:var(--text2);font-size:18px}
section{margin-top:72px}
h2{margin:8px 0 22px;font-size:30px;letter-spacing:-.02em}
.top{display:grid;gap:10px}
.row{display:grid;grid-template-columns:28px 32px 1fr auto;align-items:center;gap:12px}
.row .n{color:var(--dim);font-weight:700;font-variant-numeric:tabular-nums}
.row img{width:32px;height:32px;border-radius:8px;background:var(--soft)}
.row .bar{position:relative;height:40px;border-radius:10px;background:var(--soft);overflow:hidden}
.row .bar i{position:absolute;inset:0 auto 0 0;background:var(--acc)}
.row .bar span{position:relative;display:block;padding:0 14px;overflow:hidden;color:var(--text);font-weight:600;line-height:40px;white-space:nowrap;text-overflow:ellipsis}
.row b{min-width:74px;text-align:right;font-variant-numeric:tabular-nums}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.nums div{padding:20px;border-radius:16px;background:var(--surface)}
.nums b{display:block;margin-top:6px;font-size:40px;letter-spacing:-.03em}
.hours{display:flex;align-items:flex-end;gap:3px;height:120px;margin-top:6px}
.hours i{flex:1;min-height:2px;border-radius:3px 3px 0 0;background:var(--line)}
.hours i.on{background:var(--acc)}
.hl{display:flex;justify-content:space-between;margin-top:6px;color:var(--dim);font-size:12px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.two>div{padding:20px;border-radius:16px;background:var(--surface)}
.two b{display:block;margin-top:6px;font-size:28px;letter-spacing:-.02em}
.two small{color:var(--dim);font-size:14px}
.who{padding:36px 28px;border-radius:20px;background:var(--acc);color:var(--on-acc)}
.who .k{color:inherit;opacity:.75}
.who h2{margin:6px 0 4px;font-size:clamp(40px,7vw,64px);font-weight:800;letter-spacing:-.04em}
.who p{font-size:17px}
.share img{display:block;width:min(360px,100%);border-radius:16px;border:1px solid var(--line)}
.btns{display:flex;gap:8px;margin-top:14px}
.btns button{height:38px;padding:0 18px;border:1px solid var(--line);border-radius:19px;background:var(--surface);color:var(--text);font:600 14px "Segoe UI",system-ui,sans-serif;cursor:pointer}
.btns button:first-child{border-color:var(--acc);background:var(--acc);color:var(--on-acc)}
.note{margin-top:56px;color:var(--dim);font-size:13px}
.empty{margin-top:40px;color:var(--text2);font-size:18px}
</style>
</head>
<body>
<main>
  <div class="per" id="per"><button data-p="month">This month</button><button data-p="year">This year</button><button data-p="all">All time</button></div>
  <div id="out"></div>
  <p class="note">Counts time while YukiWeb is in front and you're at the computer. Includes your other devices signed in to the same Yuki ID.</p>
</main>
<script src="stats.js"></script>
<script>
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => `&#${c.charCodeAt(0)};`);
const LOC = () => LANG === 'en' ? 'en-GB' : LANG;
let per = 'month';
try { per = sessionStorage.getItem('yw-wr-per') || 'month'; } catch {}

const TYPES = [
  [[0, 5], 'Night owl', 'You do your best browsing after midnight.'],
  [[5, 11], 'Early bird', "You're online before most people wake up."],
  [[11, 18], 'Daytime explorer', 'Most of your browsing happens in broad daylight.'],
  [[18, 24], 'Evening cruiser', 'Evenings are for the internet.'],
];

function pick() {
  const all = statsDays(), now = new Date(), y = String(now.getFullYear()), m = y + '-' + String(now.getMonth() + 1).padStart(2, '0');
  return Object.entries(all).filter(([k]) => per === 'all' || k.startsWith(per === 'year' ? y : m)).sort(([a], [b]) => a < b ? -1 : 1);
}

function calc() {
  const days = pick(), list = days.map(([, d]) => d);
  const total = list.reduce((a, d) => a + daySecs(d), 0);
  const hours = Array(24).fill(0);
  list.forEach(d => d.h.forEach((v, i) => { hours[i] += v; }));
  let busiest = null, streak = 0, run = 0, prev = null;
  for (const [k, d] of days) {
    const s = daySecs(d);
    if (!busiest || s > busiest[1]) busiest = [k, s];
    if (s < 60) continue;
    const dt = new Date(k + 'T12:00');
    run = prev && (dt - prev) / 864e5 < 1.5 ? run + 1 : 1;
    prev = dt; streak = Math.max(streak, run);
  }
  const fav = hours.indexOf(Math.max(...hours));
  // Personality: the 4 parts of the day by time spent.
  const type = TYPES.map(x => [x, hours.slice(x[0][0], x[0][1]).reduce((a, b) => a + b, 0)]).sort((a, b) => b[1] - a[1])[0][0];
  return {
    total, hours, busiest, streak, fav, type, top: topSites(list).slice(0, 5),
    tabs: list.reduce((a, d) => a + d.tabs, 0), pages: list.reduce((a, d) => a + d.pages, 0), srch: list.reduce((a, d) => a + d.srch, 0),
  };
}

const perName = () => tr({ month: 'This month', year: 'This year', all: 'All time' }[per]);
const num = n => n.toLocaleString(LOC());
let S = null;

function draw() {
  document.querySelectorAll('#per button').forEach(b => b.classList.toggle('on', b.dataset.p === per));
  S = calc();
  if (S.total < 1800) { $('out').innerHTML = `<div class="hero"><div class="k">YukiWeb Wrapped · ${esc(perName())}</div><h1>${fmtDur(S.total)}</h1></div><p class="empty">${tr('Not enough browsing yet. Come back in a day or two.')}</p>`; return; }
  const max = S.top[0]?.[1] || 1, hmax = Math.max(...S.hours, 1), full = Math.floor(S.total / 86400);
  const bd = S.busiest && new Date(S.busiest[0] + 'T12:00').toLocaleDateString(LOC(), { weekday: 'long', day: 'numeric', month: 'long' });
  $('out').innerHTML = `
    <div class="hero"><div class="k">YukiWeb Wrapped · ${esc(perName())}</div>
      <h1><u>${fmtDur(S.total)}</u></h1>
      <p>${tr('Your time in YukiWeb')}${full ? ' · ' + t("That's {0} full days.", full) : ''}</p></div>
    <section><div class="k">${tr('Your top sites')}</div><h2 data-nt>${esc(S.top[0]?.[0] || '')}</h2>
      <div class="top" data-nt>${S.top.map(([h, s], i) => `<div class="row"><span class="n">${i + 1}</span><img src="${favicon(h)}" alt=""><div class="bar"><i style="width:${Math.max(4, s / max * 100)}%"></i><span>${esc(h)}</span></div><b>${fmtDur(s)}</b></div>`).join('')}</div></section>
    <section class="nums">
      <div><span class="k">${tr('Tabs opened')}</span><b>${num(S.tabs)}</b></div>
      <div><span class="k">${tr('Pages visited')}</span><b>${num(S.pages)}</b></div>
      <div><span class="k">${tr('Searches')}</span><b>${num(S.srch)}</b></div>
      <div><span class="k">${tr('Longest streak')}</span><b>${t('{0} days in a row', S.streak)}</b></div></section>
    <section class="two">
      <div><span class="k">${tr('Busiest day')}</span><b>${esc(bd)}</b><small>${fmtDur(S.busiest[1])}</small></div>
      <div><span class="k">${tr('Favorite hour')}</span><b>${String(S.fav).padStart(2, '0')}:00</b>
        <div class="hours">${S.hours.map((v, i) => `<i class="${i === S.fav ? 'on' : ''}" style="height:${Math.round(v / hmax * 100)}%"></i>`).join('')}</div>
        <div class="hl"><span>00</span><span>06</span><span>12</span><span>18</span><span>23</span></div></div></section>
    <section class="who"><div class="k">${tr('You are a')}</div><h2>${tr(S.type[1])}</h2><p>${tr(S.type[2])}</p></section>
    <section class="share"><div class="k">${tr('Your card')}</div><h2></h2><img id="card" alt="">
      <div class="btns"><button id="copy">${tr('Copy image')}</button><button id="save">${tr('Save image')}</button></div></section>`;
  card();
}

// Share card: 1080×1350 PNG in the current theme colors.
let cardBlob = null;
function card() {
  const cs = getComputedStyle(document.documentElement), v = n => cs.getPropertyValue(n).trim();
  const c = document.createElement('canvas'), W = 1080, H = 1350, g = c.getContext('2d');
  c.width = W; c.height = H;
  const F = (w, s) => `${w} ${s}px "Segoe UI", system-ui, sans-serif`;
  g.fillStyle = v('--surface'); g.fillRect(0, 0, W, H);
  g.fillStyle = v('--acc'); g.fillRect(0, 0, W, 300);
  g.fillStyle = v('--on-acc'); g.font = F(700, 44); g.fillText('YukiWeb Wrapped', 80, 120);
  g.font = F(600, 36); g.globalAlpha = .8; g.fillText(perName(), 80, 180); g.globalAlpha = 1;
  g.fillStyle = v('--dim'); g.font = F(600, 30); g.fillText(tr('Your time in YukiWeb').toUpperCase(), 80, 400);
  g.fillStyle = v('--text'); g.font = F(800, 130); g.fillText(fmtDur(S.total), 74, 530);
  g.fillStyle = v('--dim'); g.font = F(600, 30); g.fillText(tr('Your top sites').toUpperCase(), 80, 650);
  S.top.slice(0, 3).forEach(([h], i) => {
    g.fillStyle = v('--acc'); g.font = F(800, 56); g.fillText(String(i + 1), 80, 740 + i * 90);
    g.fillStyle = v('--text'); g.font = F(600, 52);
    let name = h; while (g.measureText(name).width > 820 && name.length > 4) name = name.slice(0, -2);
    g.fillText(name === h ? h : name + '…', 150, 740 + i * 90);
  });
  g.fillStyle = v('--dim'); g.font = F(600, 30); g.fillText(tr('You are a').toUpperCase(), 80, 1080);
  g.fillStyle = v('--text'); g.font = F(800, 76); g.fillText(tr(S.type[1]), 76, 1170);
  g.fillStyle = v('--dim'); g.font = F(400, 30); g.fillText('yuki.yukichat.lol/yukiweb', 80, 1280);
  c.toBlob(b => { cardBlob = b; $('card').src = URL.createObjectURL(b); });
  $('copy').onclick = async () => {
    try { await navigator.clipboard.write([new ClipboardItem({ 'image/png': cardBlob })]); $('copy').textContent = tr('Copied'); setTimeout(() => { $('copy').textContent = tr('Copy image'); }, 2000); }
    catch (e) { $('copy').textContent = String(e).slice(0, 40); }
  };
  $('save').onclick = () => { const a = document.createElement('a'); a.href = $('card').src; a.download = 'yukiweb-wrapped.png'; a.click(); };
}

$('per').onclick = e => {
  const b = e.target.closest('button');
  if (!b) return;
  per = b.dataset.p;
  try { sessionStorage.setItem('yw-wr-per', per); } catch {}
  draw();
};
draw();
addEventListener('langchange', draw);
addEventListener('storage', e => { if (e.key && e.key.startsWith('yw-stats')) draw(); });
</script>
</body>
</html>
