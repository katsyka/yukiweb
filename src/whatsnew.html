<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>What's new</title>
<script src="theme.js"></script>
<script src="i18n.js"></script>
<style>
*{box-sizing:border-box;margin:0}
html{background:var(--page);color:var(--text);font:15px/1.5 "Segoe UI",system-ui,sans-serif}
body{max-width:760px;margin:0 auto;padding:56px 24px 80px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:8px}
.top i{display:grid;place-items:center;width:44px;height:44px;border-radius:13px;background:var(--acc);color:var(--on-acc)}
.top i svg{width:38px;height:38px}
h1{font-size:32px;font-weight:700;letter-spacing:-.02em}
.lead{margin:0 0 36px 58px;color:var(--dim)}
.ver{margin-bottom:14px;border-radius:14px;background:var(--surface);box-shadow:0 0 0 1px var(--line2)}
summary{display:flex;align-items:baseline;gap:12px;padding:16px 20px;cursor:pointer;list-style:none}
summary::-webkit-details-marker{display:none}
summary b{font-size:18px}
summary span{flex:1;color:var(--dim);font-size:13px}
summary em{padding:2px 10px;border-radius:10px;background:var(--acc);color:var(--on-acc);font-size:12px;font-style:normal;font-weight:600}
summary::after{content:"";width:8px;height:8px;margin:0 4px 0 8px;border:solid var(--dim);border-width:0 2px 2px 0;transform:translateY(-3px) rotate(45deg);transition:transform .15s}
details[open] summary::after{transform:translateY(2px) rotate(-135deg)}
ul{list-style:none;padding:0 20px 14px}
li{display:flex;gap:14px;padding:12px 0;border-top:1px solid var(--line2)}
li .ic{flex:none;width:34px;height:34px;padding:8px;border-radius:10px;background:var(--acc-soft);color:var(--acc-text)}
li b{display:block;font-weight:600}
li p{color:var(--dim);font-size:14px}
kbd{padding:1px 6px;border-radius:5px;background:var(--soft);font:12px "Segoe UI",system-ui,sans-serif}
</style>
</head>
<body>
<div class="top"><i><svg viewBox="4 0 61 61"><path fill="#16181e" stroke="none" d="M12 47.5C8 43 6.5 37 7 31 8 17.5 19.5 8 34 8c13 0 22.5 7.5 25 18l1.6 10c1.8 2.6 2.4 5 2 8-.8 5.5-5 9-10.6 9H31c-7.5 0-14.5-1.5-19-5.5Z"/><path style="fill:var(--acc)" stroke="none" d="M34 28C22 29.2 13 35.5 9 44.4 15 39.1 23 34.5 34 33.2Z"/><rect style="fill:var(--acc)" stroke="none" x="28" y="20.5" width="34.5" height="13" rx="6.5"/><circle cx="36" cy="27" r="3.8" fill="none" stroke="#16181e" stroke-width="2.5"/><path d="m38.8 29.8 2.5 2.5" fill="none" stroke="#16181e" stroke-width="2.5" stroke-linecap="round"/></svg></i><h1>What's new</h1></div>
<p class="lead" id="lead">Everything that changed in YukiWeb, newest first.</p>
<div id="list"></div>
